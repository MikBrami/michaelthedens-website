name: Sync private intelligence preview

# Legacy safety workflow. Automatic preview synchronization is owned by
# TAIL Intelligence Platform v2 to prevent concurrent writers and branch races.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update protected preview branch manually
        run: git push --force-with-lease origin HEAD:refs/heads/agent/private-intelligence
