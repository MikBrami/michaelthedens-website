name: TAIL Intelligence Platform v2

# Single-writer workflow for generated TAIL state.
# Generated data commits must not trigger another TAIL build.

on:
  push:
    branches: [main]
    paths:
      - 'tail-intelligence/scripts/**'
      - 'scripts/**'
      - 'script.js'
      - 'en/script.js'
      - 'tail-intelligence/config/**'
      - 'tail-intelligence/package.json'
      - '.github/workflows/tail-dashboard.yml'
  schedule:
    - cron: '17 5,11,17,23 * * *'
    - cron: '37 * * * *' # Catch-up only; preflight skips when <=48 pending.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tail-intelligence-platform-main
  cancel-in-progress: false

jobs:
  update-build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tail-intelligence
    env:
      TAIL_REVIEW_LIMIT: ${{ (github.event_name == 'push' || github.event.schedule == '37 * * * *') && '96' || '24' }}
      TAIL_REVIEW_CONCURRENCY: '4'
      TAIL_REVIEW_BUDGET_MS: '600000'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ANALYST_MODEL: ${{ vars.OPENAI_ANALYST_MODEL || 'gpt-5-mini' }}
      OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL || 'gpt-5-mini' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Decide whether catch-up is needed
        id: catchup
        env:
          TAIL_IS_CATCHUP: ${{ github.event.schedule == '37 * * * *' }}
        run: node scripts/catchup-gate.mjs >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.catchup.outputs.run == 'true'
        run: npm install --ignore-scripts

      - name: Update, build and validate TAIL
        if: steps.catchup.outputs.run == 'true'
        run: npm run ci

      - name: Validate public/private boundary
        if: steps.catchup.outputs.run == 'true'
        working-directory: .
        run: npm test

      - name: Persist generated intelligence state safely
        if: steps.catchup.outputs.run == 'true'
        working-directory: .
        run: |
          git config user.name 'TAIL Intelligence Bot'
          git config user.email 'tail-intelligence-bot@users.noreply.github.com'
          git add tail-intelligence/data public-tail/data.json public-tail/data-en.json index.html en/index.html

          if git diff --cached --quiet; then
            echo 'No generated TAIL changes to commit.'
            exit 0
          fi

          git commit -m 'chore: refresh TAIL intelligence state'

          # Generated-state writes use a single-writer workflow. Refresh main before
          # publishing and rerun from the new head instead of attempting to rebase
          # generated JSON through concurrent changes.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo '::warning::Main changed during generation; aborting this publish safely. The next queued/scheduled run will regenerate from the new head.'
            exit 1
          fi

          git push origin HEAD:main
          git push --force-with-lease origin HEAD:refs/heads/agent/private-intelligence

      # Vercel deploys every main-branch push through its Git integration.
