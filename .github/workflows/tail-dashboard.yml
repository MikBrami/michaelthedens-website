name: TAIL Intelligence Platform v2

# Paid production processing is paused. Scheduled runs only collect RSS news.
on:
  push:
    branches: [main]
    paths:
      - 'tail-intelligence/scripts/**'
      - '.github/workflows/tail-dashboard.yml'
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tail-intelligence-platform-main
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Collect RSS without OpenAI credentials
        working-directory: tail-intelligence
        run: node scripts/ingest-inbox.mjs
      - name: Persist inbox only; preserve reviewed and public state
        run: |
          git config user.name 'TAIL Intelligence Bot'
          git config user.email 'tail-intelligence-bot@users.noreply.github.com'
          git add tail-intelligence/data/inbox.json tail-intelligence/data/ingestion-history.json tail-intelligence/data/update-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: collect TAIL news without paid analysis'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo '::warning::Main changed; defer inbox publication to next collection.'
            exit 0
          fi
          git push origin HEAD:main
      - name: Explain paused state
        run: echo 'Paid reviews and translations remain paused. RSS collection only; public evidence date is unchanged.' >> "$GITHUB_STEP_SUMMARY"

  cost-pilot:
    # One expressly authorized experiment, no schedule or manual-dispatch activation.
    # Rerunning this workflow cannot repeat the paid experiment.
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[tail-cost-pilot-2026-09-16]')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify admission gates and cost limits without API calls
        working-directory: tail-intelligence
        run: node --test scripts/pipeline.test.mjs scripts/bounded-review.test.mjs
      - name: Two-candidate isolated cost pilot
        working-directory: tail-intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAIL_PAID_REVIEW: pilot
        run: node scripts/review-inbox.mjs
      - name: Print usage and outcome, including incomplete responses
        if: always()
        working-directory: tail-intelligence
        run: |
          if [ -f data/review-usage.jsonl ]; then cat data/review-usage.jsonl; fi
          node --input-type=module -e "import fs from 'node:fs';const s=JSON.parse(fs.readFileSync('data/admission-status.json'));console.log(JSON.stringify({status:s.status,lastRun:s.lastRun,error:s.error}));"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tail-cost-pilot
          retention-days: 30
          path: |
            tail-intelligence/data/review-usage.jsonl
            tail-intelligence/data/review-cache/
            tail-intelligence/data/admission-status.json
            tail-intelligence/data/admission-reviews.json
      # No git write, publication, translation or index recalculation in this pilot.
