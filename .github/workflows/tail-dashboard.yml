name: TAIL Intelligence Platform v2

# RSS collection stays free. Paid evidence review is bounded and only applies to
# items ingested after the restart cutoff; the historical backlog is preserved but skipped.
on:
  push:
    branches: [main]
    paths:
      - 'tail-intelligence/scripts/**'
      - '.github/workflows/tail-dashboard.yml'
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tail-intelligence-platform-main
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Collect RSS without OpenAI credentials
        working-directory: tail-intelligence
        run: node scripts/ingest-inbox.mjs
      - name: Persist inbox
        run: |
          git config user.name 'TAIL Intelligence Bot'
          git config user.email 'tail-intelligence-bot@users.noreply.github.com'
          git add tail-intelligence/data/inbox.json tail-intelligence/data/ingestion-history.json tail-intelligence/data/update-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: collect TAIL news'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo '::warning::Main changed; defer inbox publication to next collection.'
            exit 0
          fi
          git push origin HEAD:main

  review-new-evidence:
    needs: collect-news
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install
        working-directory: tail-intelligence
        run: npm install --ignore-scripts
      - name: Review newly ingested evidence only
        working-directory: tail-intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAIL_PAID_REVIEW: pilot
          TAIL_REVIEW_CUTOFF: '2026-09-18T11:40:00Z'
          OPENAI_ANALYST_MODEL: gpt-5-mini
        run: npm run review:inbox
      - name: Rebuild current MT AI snapshot without paid translation
        working-directory: tail-intelligence
        run: |
          npm run generate:daily
          npm run sync
          npm run patch:manual
          npm run normalize:signal-dates
          npm run sync
          npm run build
          npm run check
      - name: Persist reviewed intelligence state safely
        run: |
          git config user.name 'TAIL Intelligence Bot'
          git config user.email 'tail-intelligence-bot@users.noreply.github.com'
          git add tail-intelligence/data public-tail/data.json public-tail/data-en.json
          if git diff --cached --quiet; then
            echo 'No reviewed TAIL changes to commit.'
            exit 0
          fi
          git commit -m 'chore: review new TAIL evidence and refresh snapshot'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo '::warning::Main changed during review; do not publish stale generated state.'
            exit 1
          fi
          git push origin HEAD:main
      - name: Explain bounded review state
        run: echo 'Paid review is active only for items ingested on/after 2026-09-18T11:40:00Z. Historical backlog is retained but excluded from paid review.' >> "$GITHUB_STEP_SUMMARY"
