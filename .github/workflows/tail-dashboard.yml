name: TAIL Intelligence Platform v2

# One workflow owns all generated TAIL data to prevent concurrent writes to main.

on:
  push:
    branches: [main]
    paths:
      - 'tail-intelligence/**'
      - '.github/workflows/tail-dashboard.yml'
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tail-intelligence-platform-main
  cancel-in-progress: false

jobs:
  update-build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tail-intelligence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --ignore-scripts

      - name: Update, build and validate TAIL
        run: npm run ci

      - name: Persist generated intelligence state safely
        working-directory: .
        run: |
          git config user.name 'TAIL Intelligence Bot'
          git config user.email 'tail-intelligence-bot@users.noreply.github.com'
          git add tail-intelligence/data public-tail/data.json

          if git diff --cached --quiet; then
            echo 'No generated TAIL changes to commit.'
            exit 0
          fi

          git commit -m 'chore: refresh TAIL intelligence state'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push attempt ${attempt} failed; rebasing onto the latest main."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done

          echo '::error::Unable to persist generated TAIL data after three attempts.'
          exit 1

      # Vercel already deploys every main-branch push through its Git integration.
      # Keeping deployment out of Actions avoids duplicate deploys and secret failures.
